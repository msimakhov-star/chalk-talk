[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chalk-engine"
version = "0.1.0"
description = "Chalk Talk play engine: 8 parameterised basketball templates, keyframes, validator, counters, narration, rules parser."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["chalk_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
