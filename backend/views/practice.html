<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Talk: practice plan</title>
<!-- MCP App view for practice_plan (ui://chalk-talk/practice): a timeline of practice blocks, no actions. -->
<style>
  :root { --bg: #0b0d12; --ink: #e8ecf4; --muted: #9aa3b8; --accent: #3ea6ff; --card: #151925; --line: #2a3350; }
  :root[data-theme="light"] { --bg: #f4f6fb; --ink: #111522; --muted: #525a6e; --card: #ffffff; --line: #c9d2ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 28px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 24px 40px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: baseline; gap: 20px; }
  h1 { font-size: 40px; margin: 0; flex: 1; }
  .focus { font-size: 24px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; }
  li { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 12px 0; border-bottom: 2px solid var(--line); }
  .time { font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .time small { display: block; font-size: 24px; color: var(--muted); }
  .block-title { font-size: 28px; font-weight: 600; }
  .notes { font-size: 24px; color: var(--muted); }
  .summary { font-size: 26px; color: var(--muted); margin-top: auto; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Practice plan</h1><span class="focus" id="focus"></span></header>
  <ol id="blocks"></ol>
  <div class="summary" id="summary">Waiting for the plan.</div>
</main>

<script>
// Host bridge: the view side of the MCP Apps protocol (postMessage JSON-RPC to the parent).
const host = (() => {
  let nextId = 0;
  const pending = new Map();
  const handlers = {};
  const send = (m) => parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = ++nextId; pending.set(id, { resolve, reject }); send({ id, method, params });
  });
  addEventListener("message", (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && m.method === undefined) {
      const p = pending.get(m.id); pending.delete(m.id);
      if (p) m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
      return;
    }
    if (m.method === "ui/resource-teardown" || m.method === "ping") { send({ id: m.id, result: {} }); return; }
    if (m.method === "ui/notifications/host-context-changed" && m.params?.theme) applyTheme(m.params.theme);
    (handlers[m.method] || (() => {}))(m.params || {});
  });
  const applyTheme = (theme) => document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
  async function start(appInfo) {
    const init = await request("ui/initialize", { protocolVersion: "2026-01-26", appInfo, appCapabilities: {} });
    applyTheme(init.hostContext?.theme);
    send({ method: "ui/notifications/initialized", params: {} });
    new ResizeObserver(() => send({ method: "ui/notifications/size-changed", params: { height: document.documentElement.scrollHeight } })).observe(document.body);
    return init.hostContext || {};
  }
  return { start, on: (method, fn) => handlers[method] = fn, callTool: (name, args) => request("tools/call", { name, arguments: args }) };
})();

const $ = (id) => document.getElementById(id);
const clock = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;

host.on("ui/notifications/tool-result", (params) => {
  const plan = params.structuredContent || {};
  $("title").textContent = `Practice plan, ${plan.minutes || "?"} minutes`;
  $("focus").textContent = plan.focus ? `Focus: ${plan.focus}` : "";
  $("blocks").replaceChildren(...(plan.blocks || []).map((b) => {
    const li = document.createElement("li");
    li.innerHTML = '<div class="time"><small></small></div><div><div class="block-title"></div><div class="notes"></div></div>';
    li.children[0].prepend(clock(b.start_min || 0));
    li.children[0].children[0].textContent = `${b.minutes} min`;
    li.children[1].children[0].textContent = b.title;
    li.children[1].children[1].textContent = b.notes || "";
    return li;
  }));
  $("summary").textContent = plan.summary || "";
});

host.start({ name: "chalk-talk-practice", version: "1.0.0" });
</script>
</body>
</html>
