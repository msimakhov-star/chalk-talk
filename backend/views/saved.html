<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Talk: saved</title>
<!-- MCP App view for save_to_playbook (ui://chalk-talk/saved): a confirmation card, no actions. -->
<style>
  :root { --bg: #0b0d12; --ink: #e8ecf4; --muted: #9aa3b8; --accent: #3ea6ff; --ok: #4cd97b; --card: #151925; }
  :root[data-theme="light"] { --bg: #f4f6fb; --ink: #111522; --muted: #525a6e; --card: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 28px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 40px; }
  .card { background: var(--card); border-radius: 24px; padding: 48px 56px; max-width: 900px; width: 100%; display: grid; grid-template-columns: 120px 1fr; gap: 12px 36px; align-items: center; }
  .tick { grid-row: span 3; width: 120px; height: 120px; border-radius: 50%; background: var(--ok); color: #041018; font-size: 72px; display: grid; place-items: center; }
  h1 { font-size: 40px; margin: 0; }
  .name { font-size: 32px; }
  .detail { font-size: 24px; color: var(--muted); }
  .tags { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="tick" aria-hidden="true">&#10003;</div>
    <h1 id="title">Saved to the playbook</h1>
    <div class="name" id="name">Waiting for the result.</div>
    <div class="detail" id="detail"></div>
  </div>
</main>

<script>
// Host bridge: the view side of the MCP Apps protocol (postMessage JSON-RPC to the parent).
const host = (() => {
  let nextId = 0;
  const pending = new Map();
  const handlers = {};
  const send = (m) => parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = ++nextId; pending.set(id, { resolve, reject }); send({ id, method, params });
  });
  addEventListener("message", (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && m.method === undefined) {
      const p = pending.get(m.id); pending.delete(m.id);
      if (p) m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
      return;
    }
    if (m.method === "ui/resource-teardown" || m.method === "ping") { send({ id: m.id, result: {} }); return; }
    if (m.method === "ui/notifications/host-context-changed" && m.params?.theme) applyTheme(m.params.theme);
    (handlers[m.method] || (() => {}))(m.params || {});
  });
  const applyTheme = (theme) => document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
  async function start(appInfo) {
    const init = await request("ui/initialize", { protocolVersion: "2026-01-26", appInfo, appCapabilities: {} });
    applyTheme(init.hostContext?.theme);
    send({ method: "ui/notifications/initialized", params: {} });
    new ResizeObserver(() => send({ method: "ui/notifications/size-changed", params: { height: document.documentElement.scrollHeight } })).observe(document.body);
    return init.hostContext || {};
  }
  return { start, on: (method, fn) => handlers[method] = fn, callTool: (name, args) => request("tools/call", { name, arguments: args }) };
})();

const $ = (id) => document.getElementById(id);

host.on("ui/notifications/tool-result", (params) => {
  const data = params.structuredContent || {};
  const play = data.play || {};
  $("title").textContent = data.team_name ? `Saved to the ${data.team_name} playbook` : "Saved to the playbook";
  $("name").textContent = play.name || "Play saved";
  const tags = (play.tags || []).length ? `Tags: ${play.tags.join(", ")}. ` : "";
  $("detail").innerHTML = '<span class="tags"></span><span></span>';
  $("detail").children[0].textContent = tags;
  $("detail").children[1].textContent = data.playbook_count !== undefined ? `${data.playbook_count} plays in the playbook now.` : "";
});

host.start({ name: "chalk-talk-saved", version: "1.0.0" });
</script>
</body>
</html>
